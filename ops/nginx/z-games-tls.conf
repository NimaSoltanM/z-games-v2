server {
    listen 80;
    listen [::]:80;
    server_name www.z-games.store;

    return 301 https://z-games.store$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name z-games.store api.z-games.store;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.z-games.store;

    ssl_certificate /etc/letsencrypt/live/z-games.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/z-games.store/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    return 301 https://z-games.store$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name z-games.store;

    ssl_certificate /etc/letsencrypt/live/z-games.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/z-games.store/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 2m;

    location = /.well-known/security.txt {
        default_type text/plain;
        return 200 "Contact: mailto:security@z-games.store\nExpires: 2027-08-01T00:00:00.000Z\nPreferred-Languages: fa, en\n";
    }

    location = /security.txt {
        return 308 https://$host/.well-known/security.txt;
    }

    location ~ ^/guides/[a-z0-9-]+\.mp4$ {
        root /var/www/z-games;
        try_files $uri =404;
        expires 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.z-games.store; media-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests" always;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.z-games.store;

    ssl_certificate /etc/letsencrypt/live/z-games.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/z-games.store/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 55m;

    location = /.well-known/security.txt {
        default_type text/plain;
        return 200 "Contact: mailto:security@z-games.store\nExpires: 2027-08-01T00:00:00.000Z\nPreferred-Languages: fa, en\n";
    }

    location = /security.txt {
        return 308 https://$host/.well-known/security.txt;
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_request_buffering on;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
}
